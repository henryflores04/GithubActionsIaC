name: Deploy (dev)

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform apply (dev)
    runs-on: ubuntu-latest

    environment: dev

    defaults:
      run:
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-terraform-dev
          mask-aws-account-id: true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (backend S3)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lab09/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publicar la salida
        run: |
          {
            echo "### Terraform apply completado (dev)"
            echo ""
            echo "| Salida | Valor |"
            echo "|---|---|"
            echo "| API base | $(terraform output -raw api_base_url) |"
            echo "| Ruta protegida | $(terraform output -raw api_hello_url) |"
            echo "| Ruta publica | $(terraform output -raw api_health_url) |"
            echo "| User Pool | $(terraform output -raw cognito_user_pool_id) |"
            echo "| Client ID | $(terraform output -raw cognito_client_id) |"
          } >> "$GITHUB_STEP_SUMMARY"
